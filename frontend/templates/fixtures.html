<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Fixtures - Dynasty FC</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ============================================================
           FIXTURES PAGE - FULL GREEN HERO BACKGROUND
           ============================================================ */
        .fixtures-page {
            min-height: 100vh;
            background-image: url('/images/greenhero.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 40px 0 60px;
            position: relative;
        }

        .fixtures-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 20, 10, 0.8);
            z-index: 0;
        }

        .fixtures-page .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           DONORS SECTION
           ============================================================ */
        .donors-section {
            padding: 60px 40px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .donors-section h2 {
            color: #fff;
            font-size: 36px;
            border-left: none;
            padding-left: 0;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .donors-section h2 i {
            color: #ffcc00;
        }

        .donors-section .donors-subtitle {
            color: #88ddbb;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .donors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            justify-content: center;
        }

        .donor-card {
            background: rgba(255,255,255,0.05);
            padding: 25px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .donor-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .donor-card .donor-logo {
            font-size: 36px;
            color: #ffcc00;
            margin-bottom: 10px;
        }

        .donor-card .donor-name {
            font-weight: 700;
            font-size: 16px;
            color: #fff;
        }

        .donor-card .donor-type {
            font-size: 13px;
            color: #88ddbb;
        }

        .donor-card .donor-amount {
            font-size: 14px;
            font-weight: 600;
            color: #28a745;
            margin-top: 5px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .donors-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }

            .donors-section {
                padding: 30px 20px;
            }

            .donors-section h2 {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            .donors-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .donor-card {
                padding: 15px 10px;
            }

            .donor-card .donor-logo {
                font-size: 28px;
            }

            .donors-section h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    FIXTURES PAGE
    ============================================================ -->
    <section class="fixtures-page">
        <div class="container">

            <!-- ============================================================
            SUPPORTERS SECTION ONLY
            ============================================================ -->
            <div class="donors-section">
                <h2><i class="fas fa-handshake"></i> <strong>Our Supporters</strong></h2>
                <p class="donors-subtitle">Thank you to our generous donors and sponsors</p>

                <div class="donors-grid">
                    <div class="donor-card" onclick="alert('Nike South Africa - R150,000')">
                        <div class="donor-logo"><i class="fas fa-check-circle"></i></div>
                        <div class="donor-name">Nike South Africa</div>
                        <div class="donor-type">Sponsor</div>
                        <div class="donor-amount">R150,000</div>
                    </div>

                    <div class="donor-card" onclick="alert('Gauteng Sports - R13,200')">
                        <div class="donor-logo"><i class="fas fa-trophy"></i></div>
                        <div class="donor-name">Gauteng Sports</div>
                        <div class="donor-type">Sponsor</div>
                        <div class="donor-amount">R13,200</div>
                    </div>

                    <div class="donor-card" onclick="alert('RTC - R13,200')">
                        <div class="donor-logo"><i class="fas fa-handshake"></i></div>
                        <div class="donor-name">RTC</div>
                        <div class="donor-type">Donor</div>
                        <div class="donor-amount">R13,200</div>
                    </div>

                    <div class="donor-card" onclick="alert('KPA Civils - R4,700')">
                        <div class="donor-logo"><i class="fas fa-building"></i></div>
                        <div class="donor-name">KPA Civils</div>
                        <div class="donor-type">Donor</div>
                        <div class="donor-amount">R4,700</div>
                    </div>

                    <div class="donor-card" onclick="alert('Funky Sithole Enter - R1,600')">
                        <div class="donor-logo"><i class="fas fa-music"></i></div>
                        <div class="donor-name">Funky Sithole Enter</div>
                        <div class="donor-type">Sponsor</div>
                        <div class="donor-amount">R1,600</div>
                    </div>

                    <div class="donor-card" onclick="alert('RCLFA - R1,000')">
                        <div class="donor-logo"><i class="fas fa-leaf"></i></div>
                        <div class="donor-name">RCLFA</div>
                        <div class="donor-type">Donor</div>
                        <div class="donor-amount">R1,000</div>
                    </div>

                    <div class="donor-card" onclick="alert('Ger - R300')">
                        <div class="donor-logo"><i class="fas fa-user-circle"></i></div>
                        <div class="donor-name">Ger</div>
                        <div class="donor-type">Donor</div>
                        <div class="donor-amount">R300</div>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- ============================================================
    FOOTER
    ============================================================ -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Dynasty Football Club. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/script.js"></script>
</body>
</html>
