<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - Dynasty FC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0a1f44 0%, #1a3a6e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .x {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            font-size: 50px;
            line-height: 80px;
            margin: 0 auto 25px;
        }
        h1 {
            color: #0a1f44;
            font-size: 26px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: #0a1f44;
            color: white;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            margin: 8px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #d4af37;
            color: #0a1f44;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="x">✕</div>
        <h1>Payment Cancelled</h1>
        <p>No worries — your payment was cancelled and you haven't been charged.</p>
        <p>You can try again anytime.</p>
        <a href="/donate" class="btn">Try Again</a>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
